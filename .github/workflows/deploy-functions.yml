name: Deploy Supabase functions

# Publica as edge functions quando algo em supabase/functions muda na main.
# O banco é criado colando supabase/migrations/*_sflpro_push_v2.sql no SQL Editor,
# e os segredos (SFL_API_KEY, VAPID_*) ficam em Edge Functions → Secrets no painel.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ykbpkhsrxtnnisnorwhd
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar funções
        # --yes: o CLI novo pede confirmação antes de publicar e o Actions não tem como responder.
        run: |
          supabase functions deploy push-api --project-ref "$PROJECT_ID" --no-verify-jwt --yes
          supabase functions deploy push-tick --project-ref "$PROJECT_ID" --no-verify-jwt --yes
